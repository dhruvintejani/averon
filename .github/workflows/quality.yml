name: Quality checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify generated SEO route metadata
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/seo/about.html
          test -f dist/seo/services-ocean-freight.html
          test -f dist/seo/contact.html
          test -f dist/seo/shipment-status.html

          grep -Fq '<link rel="canonical" href="https://www.averonfs.com/about" />' dist/seo/about.html
          grep -Fq '<meta property="og:url" content="https://www.averonfs.com/services/ocean-freight" />' dist/seo/services-ocean-freight.html
          grep -Fq '<title>Contact &amp; Request a Quote | Averon Freight Solutions</title>' dist/seo/contact.html
          grep -Fq '"@type":"BreadcrumbList"' dist/seo/contact.html
          grep -Fq 'https://www.averonfs.com/sitemap.xml' dist/robots.txt
          ! grep -Fq 'services/project-cargo-breakbulk' dist/sitemap.xml

      - name: Verify raw HTML H1 for public routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const pages = [
            { path: '/', file: 'dist/index.html', h1: 'Connecting Your Cargo to Global Markets' },
            { path: '/about', file: 'dist/seo/about.html', h1: 'About Averon Freight Solutions' },
            { path: '/services', file: 'dist/seo/services.html', h1: 'Freight & Logistics Solutions' },
            { path: '/services/ocean-freight', file: 'dist/seo/services-ocean-freight.html', h1: 'Ocean Freight — FCL & LCL' },
            { path: '/services/air-freight', file: 'dist/seo/services-air-freight.html', h1: 'Fast, Reliable Air Freight Solutions' },
            { path: '/services/customs-clearance', file: 'dist/seo/services-customs-clearance.html', h1: 'Smooth Customs. Efficient Cargo Movement.' },
            { path: '/services/road-inland-transport', file: 'dist/seo/services-road-inland-transport.html', h1: 'Reliable Road & Inland Transport Solutions' },
            { path: '/services/warehousing-distribution', file: 'dist/seo/services-warehousing-distribution.html', h1: 'Warehousing & Distribution Support' },
            { path: '/services/supply-chain-management', file: 'dist/seo/services-supply-chain-management.html', h1: 'Supply Chain Management' },
            { path: '/lcl-consolidation', file: 'dist/seo/lcl-consolidation.html', h1: 'LCL Consolidation' },
            { path: '/global-reach', file: 'dist/seo/global-reach.html', h1: 'Connecting Businesses Across International Trade Routes' },
            { path: '/contact', file: 'dist/seo/contact.html', h1: 'Tell Us About Your Shipment' },
            { path: '/shipment-status', file: 'dist/seo/shipment-status.html', h1: 'Track Your Shipment' },
            { path: '/privacy-policy', file: 'dist/seo/privacy-policy.html', h1: 'Privacy Policy' },
            { path: '/terms-and-conditions', file: 'dist/seo/terms-and-conditions.html', h1: 'Terms & Conditions' },
            { path: '/services/project-cargo-breakbulk', file: 'dist/seo/project-cargo-breakbulk.html', h1: 'Project Cargo & Breakbulk' },
          ];

          const decodeHtml = (value) => value
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .replace(/&amp;/g, '&');

          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const sitemapXml = fs.readFileSync('dist/sitemap.xml', 'utf8');
          const sitemapPaths = [...sitemapXml.matchAll(/<loc>(.*?)<\/loc>/g)]
            .map(([, url]) => new URL(url).pathname);

          for (const page of pages) {
            const html = fs.readFileSync(page.file, 'utf8');
            const allHeadings = [...html.matchAll(/<h1\b[^>]*>([\s\S]*?)<\/h1>/gi)];
            const root = html.match(/<div\s+id="root">([\s\S]*?)<\/div>/i);
            const rootHeadings = root
              ? [...root[1].matchAll(/<h1\b[^>]*>([\s\S]*?)<\/h1>/gi)]
              : [];

            if (allHeadings.length !== 1 || rootHeadings.length !== 1) {
              throw new Error(page.path + ': expected exactly one raw H1 inside #root; found ' + allHeadings.length + ' total and ' + rootHeadings.length + ' inside #root.');
            }

            const actual = decodeHtml(rootHeadings[0][1].replace(/<[^>]*>/g, '')).replace(/\s+/g, ' ').trim();
            if (actual !== page.h1) {
              throw new Error(page.path + ': expected raw H1 "' + page.h1 + '", got "' + actual + '".');
            }

            if (page.path !== '/') {
              const rewrite = vercel.rewrites.find((item) => item.source === page.path);
              const expectedDestination = '/' + page.file.replace(/^dist\//, '');
              if (!rewrite || rewrite.destination !== expectedDestination) {
                throw new Error(page.path + ': Vercel rewrite does not target ' + expectedDestination + '.');
              }
            }

            console.log('PASS raw HTML H1 — ' + page.path + ': ' + actual);
          }

          if (sitemapPaths.length !== 13) {
            throw new Error('Expected 13 sitemap URLs; found ' + sitemapPaths.length + '.');
          }
          const missing = sitemapPaths.filter((path) => !pages.some((page) => page.path === path));
          if (missing.length) {
            throw new Error('Sitemap URLs without raw-H1 validation: ' + missing.join(', '));
          }

          console.log('PASS: all 13 sitemap URLs have the expected H1 in their production HTML files and Vercel route mappings.');
          console.log('PASS: legal and pending-confirmation routes also have route-specific raw H1 fallbacks.');
          NODE

      - name: Production dependency security audit
        run: npm run audit:prod

      - name: Full dependency security audit
        id: full-audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Desktop, tablet and mobile browser smoke tests
        shell: bash
        run: |
          set -euo pipefail

          npm run preview -- --host 127.0.0.1 > /tmp/averon-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:4173/ > /dev/null; then
            cat /tmp/averon-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary is available on this runner."
            exit 1
          fi

          render_and_check() {
            local route="$1"
            local expected="$2"
            local size="$3"
            local slug="$4"
            local output="/tmp/${slug}.html"
            local chrome_log="/tmp/${slug}.chrome.log"

            echo "Checking ${slug}: ${route} at ${size}"

            if ! timeout 45s "$CHROME"               --headless               --no-sandbox               --disable-gpu               --disable-dev-shm-usage               --window-size="$size"               --virtual-time-budget=2500               --dump-dom "http://127.0.0.1:4173${route}" > "$output" 2> "$chrome_log"; then
              echo "Chrome failed while checking ${slug}."
              tail -n 80 "$chrome_log" || true
              return 1
            fi

            if ! grep -Fq "$expected" "$output"; then
              echo "Expected text was not found for ${slug}: $expected"
              grep -o '<h1[^>]*>[^<]*' "$output" | head -n 5 || true
              return 1
            fi
            
            local h1_count
            h1_count="$(grep -oE '<h1([[:space:]>])' "$output" | wc -l | tr -d '[:space:]')"
            if [ "$h1_count" -ne 1 ]; then
              echo "Expected exactly one rendered H1 for $slug; found $h1_count."
              grep -o '<h1[^>]*>[^<]*' "$output" | head -n 5 || true
              return 1
            fi
          }

          # Direct-route desktop rendering validates refreshability for every public route.
          render_and_check "/" "Connecting Your Cargo to Global Markets" "1440,1000" "home-desktop"
          render_and_check "/about" "About Averon" "1440,1000" "about-desktop"
          render_and_check "/services" "Freight & Logistics" "1440,1000" "services-desktop"
          render_and_check "/services/ocean-freight" "Ocean Freight" "1440,1000" "ocean-desktop"
          render_and_check "/services/air-freight" "Air Freight" "1440,1000" "air-desktop"
          render_and_check "/services/customs-clearance" "Customs Clearance" "1440,1000" "customs-desktop"
          render_and_check "/services/road-inland-transport" "Road & Inland Transport" "1440,1000" "road-desktop"
          render_and_check "/services/warehousing-distribution" "Warehousing & Distribution" "1440,1000" "warehouse-desktop"
          render_and_check "/services/supply-chain-management" "Supply Chain Management" "1440,1000" "supply-chain-desktop"
          render_and_check "/lcl-consolidation" "LCL Consolidation" "1440,1000" "lcl-desktop"
          render_and_check "/global-reach" "Global Reach" "1440,1000" "global-desktop"
          render_and_check "/contact" "Tell Us About Your Shipment" "1440,1000" "contact-desktop"
          render_and_check "/shipment-status" "Track Your Shipment" "1440,1000" "status-desktop"
          render_and_check "/privacy-policy" "Privacy Policy" "1440,1000" "privacy-desktop"
          render_and_check "/terms-and-conditions" "Terms & Conditions" "1440,1000" "terms-desktop"
          render_and_check "/services/project-cargo-breakbulk" "Service confirmation pending" "1440,1000" "project-pending-desktop"
          render_and_check "/does-not-exist" "Page Not Found" "1440,1000" "not-found-desktop"

          # Representative mobile viewports validate the responsive shell and core workflows.
          render_and_check "/" "Connecting Your Cargo to Global Markets" "390,844" "home-mobile"
          render_and_check "/services" "Freight & Logistics" "390,844" "services-mobile"
          render_and_check "/services/ocean-freight" "Ocean Freight" "390,844" "ocean-mobile"
          render_and_check "/global-reach" "Global Reach" "390,844" "global-mobile"
          render_and_check "/contact" "Tell Us About Your Shipment" "390,844" "contact-mobile"
          render_and_check "/shipment-status" "Track Your Shipment" "390,844" "status-mobile"

          # Representative tablet viewports catch breakpoint and navigation regressions.
          render_and_check "/" "Connecting Your Cargo to Global Markets" "768,1024" "home-tablet"
          render_and_check "/services" "Freight & Logistics" "768,1024" "services-tablet"
          render_and_check "/global-reach" "Global Reach" "768,1024" "global-tablet"
          render_and_check "/contact" "Tell Us About Your Shipment" "768,1024" "contact-tablet"
          render_and_check "/shipment-status" "Track Your Shipment" "768,1024" "status-tablet"

      - name: Local Lighthouse quality audit
        id: lighthouse
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          npm run preview -- --host 127.0.0.1 > /tmp/averon-lighthouse-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/             --quiet             --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage"             --only-categories=performance,accessibility,best-practices,seo             --output=json             --output-path=/tmp/averon-lighthouse.json

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/averon-lighthouse.json', 'utf8'));
          for (const key of ['performance', 'accessibility', 'best-practices', 'seo']) {
            const score = Math.round((report.categories[key]?.score ?? 0) * 100);
            console.log(`${key}: ${score}`);
          }

          console.log('Core Web Vitals / lab metrics:');
          for (const [id, label] of [
            ['first-contentful-paint', 'FCP'],
            ['largest-contentful-paint', 'LCP'],
            ['total-blocking-time', 'TBT'],
            ['cumulative-layout-shift', 'CLS'],
            ['speed-index', 'Speed Index'],
          ]) {
            const audit = report.audits[id];
            console.log(`${label}: ${audit?.displayValue ?? 'not available'}`);
          }

          console.log('Performance checks that need attention:');
          for (const ref of report.categories.performance?.auditRefs ?? []) {
            const audit = report.audits[ref.id];
            if (!audit || ['notApplicable', 'manual', 'informative'].includes(audit.scoreDisplayMode)) continue;
            if (audit.score !== null && audit.score < 1) {
              console.log(`[performance] ${ref.id}: ${audit.title} (score: ${audit.score}, value: ${audit.displayValue ?? 'n/a'})`);
            }
          }

          console.log('Lighthouse checks that need attention:');
          for (const key of ['accessibility', 'best-practices', 'seo']) {
            for (const ref of report.categories[key]?.auditRefs ?? []) {
              const audit = report.audits[ref.id];
              if (!audit || ['notApplicable', 'manual', 'informative'].includes(audit.scoreDisplayMode)) continue;
              if (audit.score !== null && audit.score < 1) {
                console.log(`[${key}] ${ref.id}: ${audit.title} (score: ${audit.score})`);
              }
            }
          }
          NODE

      - name: Verify deployed raw H1 responses
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pages = [
            { path: '/', h1: 'Connecting Your Cargo to Global Markets' },
            { path: '/about', h1: 'About Averon Freight Solutions' },
            { path: '/services', h1: 'Freight & Logistics Solutions' },
            { path: '/services/ocean-freight', h1: 'Ocean Freight — FCL & LCL' },
            { path: '/services/air-freight', h1: 'Fast, Reliable Air Freight Solutions' },
            { path: '/services/customs-clearance', h1: 'Smooth Customs. Efficient Cargo Movement.' },
            { path: '/services/road-inland-transport', h1: 'Reliable Road & Inland Transport Solutions' },
            { path: '/services/warehousing-distribution', h1: 'Warehousing & Distribution Support' },
            { path: '/services/supply-chain-management', h1: 'Supply Chain Management' },
            { path: '/lcl-consolidation', h1: 'LCL Consolidation' },
            { path: '/global-reach', h1: 'Connecting Businesses Across International Trade Routes' },
            { path: '/contact', h1: 'Tell Us About Your Shipment' },
            { path: '/shipment-status', h1: 'Track Your Shipment' },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const decodeHtml = (value) => value
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .replace(/&amp;/g, '&');

          for (const page of pages) {
            let verified = false;
            let lastReason = 'no response';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const url = new URL(page.path, 'https://www.averonfs.com');
                url.searchParams.set('__h1_check', process.env.GITHUB_SHA || 'main');
                const response = await fetch(url, {
                  headers: {
                    'user-agent': 'Averon-H1-Verification/1.0',
                    'cache-control': 'no-cache',
                  },
                });
                const html = await response.text();
                const headings = [...html.matchAll(/<h1\b[^>]*>([\s\S]*?)<\/h1>/gi)];
                const fallback = [...html.matchAll(/<h1\s+id="seo-fallback-h1"[^>]*>([\s\S]*?)<\/h1>/gi)];

                if (response.ok && headings.length === 1 && fallback.length === 1) {
                  const actual = decodeHtml(fallback[0][1].replace(/<[^>]*>/g, '')).replace(/\s+/g, ' ').trim();
                  if (actual === page.h1) {
                    console.log('PASS live raw HTTP H1 — ' + page.path + ': ' + actual);
                    verified = true;
                    break;
                  }
                  lastReason = 'expected "' + page.h1 + '", got "' + actual + '"';
                } else {
                  lastReason = 'HTTP ' + response.status + ', H1 count ' + headings.length + ', fallback count ' + fallback.length;
                }
              } catch (error) {
                lastReason = String(error);
              }

              if (attempt < 12) await sleep(10000);
            }

            if (!verified) {
              throw new Error('Live raw HTML H1 check failed for ' + page.path + ': ' + lastReason);
            }
          }

          console.log('PASS: live HTTP responses contain the expected single raw H1 for all 13 sitemap URLs.');
          NODE

      - name: Report full audit status
        if: always()
        run: |
          echo "Full npm audit outcome: ${{ steps.full-audit.outcome }}"
          echo "Lighthouse audit outcome: ${{ steps.lighthouse.outcome }}"
